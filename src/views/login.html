<h1>Iniciar sesión</h1>
<form id="loginForm">

    <input type="text" id="username" name="username" required>

    <label for="password">Contraseña</label> <input type="text" id="password" name="password" required> 
    <button type="submit">Iniciar sesión</button>
</form>
<button id="sign-up">No tienes cuenta</button>
<p id="loginError">Credenciales inválidas</p>
